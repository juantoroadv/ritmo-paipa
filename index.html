<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritmo Paipa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="theme-color" content="#0e110f">
<title>Ritmo Paipa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Dos cosas: arriba el cronómetro de la etapa, abajo el roadbook. */
:root{
  --bg:#0e110f; --panel:#171b18; --ink:#f2f4f0; --muted:#9aa39c; --line:#2f3630;
  --ok:#2fd16b; --warn:#ffc21a; --bad:#ff4d3d; --accent:#ffc21a;
  --f-num:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
body{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:6px}
button,select,input{font:inherit;color:inherit}
button{border-radius:10px;border:1px solid var(--line);background:transparent;padding:8px 12px;min-height:48px;font-weight:700;cursor:pointer}

/* ---- Cronómetro ---- */
#crono{min-width:0;background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
#crono.corre{border-color:var(--accent)} #crono.ok{border-color:var(--ok)} #crono.warn{border-color:var(--warn)} #crono.bad{border-color:var(--bad)}
.f1{display:flex;gap:8px;align-items:center}
#etapa{flex:1;min-width:0;font-family:var(--f-num);font-weight:700;font-size:18px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#hora{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;text-align:right;line-height:1;white-space:nowrap}
#hora small{display:block;font:600 10px var(--f-body);color:var(--muted)}
.f2{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:10px}
#tCorre{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(44px,13vw,64px);line-height:.85}
.meta{font-family:var(--f-num);line-height:1}
.meta small,.f3 small{font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.meta b{display:block;font-size:clamp(24px,7.5vw,36px);color:var(--accent);font-variant-numeric:tabular-nums}
.f3{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-num);font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:4px}
.f3 b{display:block;font-size:clamp(22px,6.6vw,32px);line-height:1}
.f3>div:nth-child(2){text-align:center}
.f3 .r{text-align:right}
#res{font-family:var(--f-num);font-size:clamp(20px,6vw,28px);font-weight:700;text-align:center;margin:0}
#res:empty{display:none}
#res.ok{color:var(--ok)} #res.warn{color:var(--warn)} #res.bad{color:var(--bad)}
.f4{display:flex;gap:6px}
#btnAccion{min-height:52px;font-family:var(--f-num);font-size:clamp(17px,5vw,22px);line-height:1.05;padding:4px 6px;letter-spacing:.02em;background:var(--accent);color:#111;border-color:var(--accent)}
#btnAccion.armado{background:var(--bad);border-color:var(--bad);color:#fff}
#btnAjustes{width:44px;min-height:40px;padding:0;font-size:20px}
#ajustes{display:none;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:6px;font-size:14px;color:var(--muted)}
#ajustes.ver{display:flex}
#ajustes .fila{display:flex;gap:6px;align-items:center}
#ajustes input{flex:1;font-family:var(--f-num);font-size:22px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
#ajustes button{flex:1;font-size:14px}

/* ---- Roadbook ---- */
#lista{overflow-y:auto;background:#fff;border-radius:10px;-webkit-overflow-scrolling:touch;position:relative}
.cas{display:grid;grid-template-columns:clamp(104px,31vw,150px) clamp(78px,24vw,120px) 1fr;border-bottom:3px solid #d0d0d0;border-left:14px solid #12a63c;color:#111;background:#fff;min-height:96px;cursor:pointer}
.cas.c-R{border-left-color:#e01e12} .cas.c-P{border-left:20px solid #7b2cbf}
.cPar{display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;background:#ecf8ef;font-family:var(--f-num)}
.c-R .cPar{background:#ffecea} .c-P .cPar{background:#f1e6fb}
.cPar small{font:700 11px var(--f-body);letter-spacing:.06em;color:#555} .c-P .cPar small{color:#7b2cbf}
.cPar b{font-size:clamp(40px,12.5vw,60px);font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.cPar span{font-size:clamp(15px,4.4vw,19px);font-weight:600;color:#333;font-variant-numeric:tabular-nums}
.cIco{width:100%;height:100%;max-height:120px;object-fit:contain;padding:4px;border-right:1px solid #ddd;background:#fff;display:block}
.cTxt{padding:6px 8px;display:flex;flex-direction:column;gap:2px;justify-content:center}
.cTxt b{font-family:var(--f-num);font-size:clamp(22px,6.6vw,30px);line-height:1.02;text-transform:uppercase}
.c-R .cTxt b{color:#d0150a} .c-P .cTxt b,.c-P .cTxt span{color:#7b2cbf}
.cTxt span{font-size:clamp(14px,4vw,17px);line-height:1.2} .c-P .cTxt span{font-weight:700}
.cas.act{outline:5px solid #f0a800;outline-offset:-5px}
.cOrig{grid-column:1/-1;width:100%;display:block;border-top:1px solid #ddd}
.cFoto{grid-column:1/-1;min-height:0;padding:3px;font-size:12px;font-weight:600;color:#666;border:0;border-top:1px dashed #ccc;border-radius:0;background:#fafafa}
.fin{color:#333;text-align:center;padding:30px 10px 55vh;font:700 18px var(--f-body)}

/* ---- Botones de casilla ---- */

@media (orientation:landscape){
  body{grid-template-columns:minmax(260px,36%) 1fr;grid-template-rows:1fr}
  #crono{overflow-y:auto} .f2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<section id="crono" aria-label="Cronómetro de la etapa">
  <div class="f1">
    <select id="etapa" aria-label="Etapa"></select>
    <div id="hora" role="button" title="Sincronizar hora">--:--:--<small id="sync">hora sin sincronizar</small></div>
    <button id="btnAjustes" aria-label="Ajustes">⋯</button>
  </div>
  <div class="f2">
    <div id="tCorre">0:00</div>
    <div class="meta"><small>Debe marcar</small><b id="tMeta">--:--</b></div>
    <button id="btnAccion">SALGO YA</button>
  </div>
  <p id="res"></p>
  <div id="ajustes">
    <div class="fila" style="font-family:var(--f-num);font-size:20px;color:var(--ink)">Llegar a las&nbsp;<b id="hLlegar">--:--:--</b>&nbsp;·&nbsp;<span id="lFalta">Faltan</span>&nbsp;<b id="tFalta">--:--</b></div>
    <div class="fila" style="font-family:var(--f-num);font-size:20px;color:var(--ink)">Km ideal ahora&nbsp;<b id="kmIdeal">--</b></div>
    <div class="fila"><label for="inSalida" style="flex:0 0 auto">Salida</label><input id="inSalida" type="time" step="1"><button id="bSalida">Usar esta hora</button></div>
    <div class="fila"><label for="inLleg" style="flex:0 0 auto">Llegada</label><input id="inLleg" type="time" step="1"><button id="bLleg">Usar esta hora</button></div>
    <div class="fila"><button id="bBorrar">Borrar etapa</button><button id="bSync">Sincronizar hora</button></div>
  </div>
</section>

<main id="lista" aria-label="Roadbook"></main>


<script>
const $=s=>document.querySelector(s);
const leer=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const guardar=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const dos=n=>String(n).padStart(2,"0");
const fmtHora=d=>`${dos(d.getHours())}:${dos(d.getMinutes())}:${dos(d.getSeconds())}`;
const fmtKm=x=>x.toFixed(2).replace(".",",");
const fmtDur=s=>{s=Math.abs(Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?`${h}:${dos(m)}`:`${m}`)+":"+dos(s%60)};
const fmtDif=d=>{const a=Math.abs(d);return d===0?"justo a tiempo":(d>0?"+":"−")+(a<60?a+" s":fmtDur(a))+(d>0?" tarde":" antes")};

// ---- Hora exacta (la misma referencia global que usa el organizador) ----
let OFF=parseFloat(leer("off"))||0;
const ahoraMs=()=>Date.now()+OFF;
async function muestra(){
  const t0=Date.now(); const r=await fetch("https://timeapi.io/api/time/current/zone?timeZone=UTC",{cache:"no-store"}); const j=await r.json(); const t1=Date.now();
  const srv=Date.parse(j.dateTime.slice(0,23)+"Z"); if(isNaN(srv)) throw 0; return {off:srv-(t0+t1)/2,rtt:t1-t0};
}
async function muestraCf(){
  const t0=Date.now(); const x=await (await fetch("https://www.cloudflare.com/cdn-cgi/trace",{cache:"no-store"})).text(); const t1=Date.now();
  const ts=parseFloat((x.match(/ts=([\d.]+)/)||[])[1]); if(!ts) throw 0; return {off:ts*1000+500-(t0+t1)/2,rtt:t1-t0+1000};
}
async function sincronizar(){
  let m=null; for(let i=0;i<5;i++){ try{ const x=await muestra(); if(!m||x.rtt<m.rtt) m=x }catch(e){} }
  if(!m){ try{ m=await muestraCf() }catch(e){} }
  if(m){ OFF=m.off; guardar("off",String(OFF)); guardar("offCuando",String(ahoraMs())); guardar("offPrec",(Math.max(m.rtt/2,20)/1000).toFixed(2)) }
  pintarSync();
}
function pintarSync(){ const c=leer("offCuando"); $("#sync").textContent=c?`hora exacta ✓ ±${(leer("offPrec")||"?").replace(".",",")} s`:"hora sin sincronizar" }

// ---- Plan ----
let PLAN=null, E=0, rbI=0;
const T=()=>PLAN.tramos[E];
const nomCorto=t=>t.nombre.split(" · ").slice(0,2).join(" · ");
const destino=t=>(t.controles||[]).find(c=>Math.abs(c.km-t.fin_km)<1e-6)?.nombre||"Fin de etapa";
function horaHoy(v){ if(!v) return null; const[h,m,s]=v.split(":").map(Number); const d=new Date(ahoraMs()); d.setHours(h,m,s||0,0); return d.getTime() }
const salidaDe=t=>+(leer("sal-"+t.id)||0)||null;
const llegDe=t=>+(leer("lleg-"+t.id)||0)||null;

function cargar(p){
  PLAN=p; const sel=$("#etapa");
  sel.innerHTML=p.tramos.map((t,i)=>`<option value="${i}">Etapa ${i+1} · ${t.nombre.split(" · ")[1]}</option>`).join("");
  E=Math.min(+(leer("etapa")||0),p.tramos.length-1); sel.value=E;
  p.tramos.forEach(t=>(t.roadbook?.casillas||[]).forEach(c=>fetch(c.ico).catch(()=>{})));   // quedan guardadas para modo avión
  pintarLista(); tic();
}
$("#etapa").addEventListener("change",e=>{ E=+e.target.value; guardar("etapa",E); desarmar(); pintarLista(); tic() });

// ---- Cronómetro ----
let armado=0, tArm=null;
function desarmar(){ armado=0; clearTimeout(tArm); $("#btnAccion").classList.remove("armado") }
$("#btnAccion").addEventListener("click",()=>{
  const t=T(), sal=salidaDe(t), ll=llegDe(t);
  // doble toque para no marcar por accidente: la hora que queda es la del PRIMER toque
  if(!armado||ahoraMs()-armado>3000){ armado=ahoraMs(); const b=$("#btnAccion"); b.classList.add("armado"); b.textContent="OTRA VEZ";
    clearTimeout(tArm); tArm=setTimeout(()=>{desarmar(); tic()},3000); return }
  const h=armado; desarmar();
  if(!sal){ guardar("sal-"+t.id,h); guardar("lleg-"+t.id,"") }
  else if(!ll){ guardar("lleg-"+t.id,h) }
  else if(E+1<PLAN.tramos.length){ E++; guardar("etapa",E); $("#etapa").value=E; guardar("sal-"+T().id,h); guardar("lleg-"+T().id,""); pintarLista() }
  pedirPantalla(); tic();
});
$("#btnAjustes").addEventListener("click",()=>{ const a=$("#ajustes"); a.classList.toggle("ver");
  const t=T(); $("#inSalida").value=salidaDe(t)?fmtHora(new Date(salidaDe(t))):""; $("#inLleg").value=llegDe(t)?fmtHora(new Date(llegDe(t))):"" });
$("#bSalida").addEventListener("click",()=>{ const v=horaHoy($("#inSalida").value); if(v){ guardar("sal-"+T().id,v); tic() } });
$("#bLleg").addEventListener("click",()=>{ const v=horaHoy($("#inLleg").value); if(v&&salidaDe(T())){ guardar("lleg-"+T().id,v); tic() } });
$("#bBorrar").addEventListener("click",()=>{ if(confirm(`¿Borrar salida y llegada de la etapa ${E+1}?`)){ guardar("sal-"+T().id,""); guardar("lleg-"+T().id,""); tic() } });
$("#bSync").addEventListener("click",()=>{ $("#sync").textContent="sincronizando…"; sincronizar() });
$("#hora").addEventListener("click",()=>{ $("#sync").textContent="sincronizando…"; sincronizar() });

function tic(){
  const ahora=ahoraMs(); $("#hora").firstChild.nodeValue=fmtHora(new Date(ahora));
  if(!PLAN) return;
  const t=T(), meta=t.tiempo_ideal_min*60, sal=salidaDe(t), ll=llegDe(t), C=$("#crono"), b=$("#btnAccion");
  const ini=t.km_inicio||0, vel=t.secciones[0].vel;
  $("#tMeta").textContent=fmtDur(meta);
  if(!sal){
    C.className=""; $("#tCorre").textContent="0:00"; $("#hLlegar").textContent="--:--:--"; $("#lFalta").textContent="Destino"; $("#tFalta").textContent=destino(t).replace(/^Control /,"");
    $("#kmIdeal").textContent=fmtKm(ini); $("#res").textContent=""; if(!armado) b.textContent="SALGO YA"; return;
  }
  const ideal=sal+meta*1000, fin=ll||ahora, corre=(fin-sal)/1000;
  $("#tCorre").textContent=corre<0?"−"+fmtDur(corre):fmtDur(corre);
  $("#hLlegar").textContent=fmtHora(new Date(ideal));
  $("#kmIdeal").textContent=fmtKm(Math.min(t.fin_km,ini+vel*Math.max(0,corre)/3600));
  if(ll){
    const d=Math.round((ll-ideal)/1000), a=Math.abs(d), cl=a<=3?"ok":a<=15?"warn":"bad";
    C.className=cl; $("#res").className=cl; $("#res").textContent=`Llegaste ${fmtHora(new Date(ll))} · ${fmtDif(d)}`;
    $("#lFalta").textContent="Diferencia"; $("#tFalta").textContent=(d>0?"+":d<0?"−":"")+fmtDur(a);
    if(!armado) b.textContent=E+1<PLAN.tramos.length?`SALGO · ETAPA ${E+2}`:"TERMINADO";
    b.disabled=E+1>=PLAN.tramos.length;
  }else{
    C.className="corre"; $("#res").textContent=""; b.disabled=false;
    const f=(ideal-ahora)/1000; $("#lFalta").textContent=f>=0?"Faltan":"Pasado por"; $("#tFalta").textContent=fmtDur(f);
    if(!armado) b.textContent="LLEGUÉ";
  }
}

// ---- Roadbook ----
function pintarLista(){
  const t=T(), cs=t.roadbook?.casillas||[], L=$("#lista");
  L.innerHTML=cs.map((c,i)=>`<div class="cas c-${c.c}" data-i="${i}" data-f="${c.foto}"><div class="cPar"><small>PARCIAL${c.c==="P"?" · ¡OJO!":""}</small><b>${fmtKm(c.par)}</b><span>#${c.n} · total ${fmtKm(c.tot)}</span></div><img class="cIco" src="${c.ico}" alt=""><div class="cTxt"><b>${c.dir}</b>${c.det?`<span>${c.det}</span>`:""}</div></div>`).join("")
    +`<div class="fin">Fin de la etapa ${E+1} · ${destino(t)}</div>`;
  rbI=Math.min(+(leer("rb-"+t.id)||0),cs.length-1); setTimeout(()=>irCasilla(rbI,false),30);
}
function irCasilla(i,anim=true){
  const n=T().roadbook.casillas.length; rbI=Math.max(0,Math.min(i,n-1)); guardar("rb-"+T().id,rbI);
  const L=$("#lista"); L.querySelectorAll(".cas").forEach(c=>c.classList.toggle("act",+c.dataset.i===rbI));
  const c=L.querySelector(`.cas[data-i="${rbI}"]`); if(c) L.scrollTo({top:c.offsetTop-Math.round(c.offsetHeight*0.3),behavior:anim?"smooth":"auto"});
}
$("#lista").addEventListener("click",e=>{
  const c=e.target.closest(".cas"); if(!c) return;
  // tocar la casilla marcada otra vez abre o cierra la foto original del libro
  if(c.classList.contains("act")){ const im=c.querySelector(".cOrig"); if(im) im.remove(); else { const n=document.createElement("img"); n.className="cOrig"; n.src=c.dataset.f; c.appendChild(n) } return }
  irCasilla(+c.dataset.i);
});
// botonera Bluetooth que funcione como teclado
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT/.test(document.activeElement?.tagName)) return;
  if(["ArrowDown","ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); irCasilla(rbI+1) }
  else if(["ArrowUp","ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); irCasilla(rbI-1) }
});

// ---- Pantalla siempre encendida ----
let wake=null;
async function pedirPantalla(){ try{ wake=await navigator.wakeLock?.request("screen") }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pedirPantalla() });
document.addEventListener("click",pedirPantalla,{once:true});

setInterval(tic,250); pintarSync(); sincronizar(); setInterval(()=>{ if(!PLAN||!salidaDe(T())||llegDe(T())) sincronizar() },10*60*1000);
fetch("plan.json",{cache:"no-cache"}).then(r=>r.json()).then(p=>{guardar("plan",JSON.stringify(p));cargar(p)})
 .catch(()=>{const g=leer("plan"); if(g) cargar(JSON.parse(g)); else $("#lista").innerHTML='<div class="fin">Ábrela una vez con señal para guardar el roadbook.</div>'});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
